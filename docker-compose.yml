services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    ports:
      - "${WP_HOST_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - db

  wp-init:
    image: wordpress:cli
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_HOST_PORT: ${WP_HOST_PORT}
    volumes:
      - wordpress_data:/var/www/html
      - ./mod.php:/tmp/mod.php
      - ./patch-pluggable.sh:/tmp/patch-pluggable.sh
      - ./custom-registration.php:/tmp/custom-registration.php
      - ./dynamic-url.php:/tmp/dynamic-url.php  

    user: root
    command: >
      bash -c "
        sleep 30 &&
        
        if wp core is-installed --allow-root 2>/dev/null; then
          echo 'WordPress already installed, skipping setup'
          exit 0
        fi &&
        
        wp core install --url=localhost:$$WP_HOST_PORT --title=CTF --admin_user=$$WP_ADMIN_USER --admin_password=$$WP_ADMIN_PASSWORD --admin_email=$$WP_ADMIN_EMAIL --allow-root &&
        
        wp option update users_can_register 1 --allow-root &&
        wp option update default_role author --allow-root &&
        wp option update comment_moderation 0 --allow-root &&
        wp option update comment_whitelist 0 --allow-root &&
        wp option update comment_previously_approved 0 --allow-root &&
        
        mkdir -p /var/www/html/wp-content/plugins/custom-registration &&
        cp /tmp/custom-registration.php /var/www/html/wp-content/plugins/custom-registration/custom-registration.php &&
        chown -R www-data:www-data /var/www/html/wp-content/plugins/custom-registration &&
        
        wp plugin activate custom-registration --allow-root &&
        
        echo 'Setting up pages...' &&
        
        REGISTER_ID=$$(wp post list --post_type=page --name=register --field=ID --allow-root 2>/dev/null) &&
        if [ -n \"$$REGISTER_ID\" ]; then
          wp post delete $$REGISTER_ID --force --allow-root
        fi &&
        
        LOGIN_ID=$$(wp post list --post_type=page --name=login --field=ID --allow-root 2>/dev/null) &&
        if [ -n \"$$LOGIN_ID\" ]; then
          wp post delete $$LOGIN_ID --force --allow-root
        fi &&
        
        wp post create --post_title='Register' --post_content='[custom_register]' --post_status=publish --post_type=page --post_name=register --comment_status=closed --allow-root &&
        
        wp post create --post_title='Login' --post_content='[custom_login]' --post_status=publish --post_type=page --post_name=login --comment_status=closed --allow-root &&
        
        wp rewrite structure '/%postname%/' --allow-root &&
        wp rewrite flush --allow-root &&
        
        mkdir -p /var/www/html/wp-content/mu-plugins &&
        cp /tmp/mod.php /var/www/html/wp-content/mu-plugins/mod.php &&

        cp /tmp/dynamic-url.php /var/www/html/wp-content/mu-plugins/dynamic-url.php &&
        chown www-data:www-data /var/www/html/wp-content/mu-plugins/dynamic-url.php &&

        chown -R www-data:www-data /var/www/html/wp-content/mu-plugins &&
        
        bash /tmp/patch-pluggable.sh &&
        
        echo 'WordPress setup completed'
      "
    depends_on:
      - db
      - wordpress

volumes:
  db_data:
  wordpress_data: